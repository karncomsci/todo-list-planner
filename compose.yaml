# Runs the whole Task Calendar Planner (D3). Copy .env.example to .env first.
name: planner

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Loopback only, for the API test suite. 5433 avoids a PostgreSQL installed on the host.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./planner-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "8080"
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only, for debugging. The browser reaches the API through the web front end (D4).
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    build: ./planner-web
    environment:
      # The web forwards /api/* here (D4). Read at run time, so the image is the same on any machine.
      API_URL: http://api:8080
    depends_on:
      - api
    ports:
      # Open on the network so the Owner's phone can reach it.
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
